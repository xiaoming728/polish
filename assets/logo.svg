<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B7BFF"/>
      <stop offset="0.55" stop-color="#7A4DF0"/>
      <stop offset="1" stop-color="#D2559B"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#EDE8FF"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#2A0F6B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- macOS 图标网格：824×824 主体居中，留出阴影空间 -->
  <g filter="url(#drop)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  </g>

  <!-- 三行文字，最后一行收尾处化作闪光：润色 -->
  <g filter="url(#soft)" fill="url(#ink)">
    <rect x="222" y="292" width="420" height="72" rx="36"/>
    <rect x="222" y="428" width="508" height="72" rx="36"/>
    <rect x="222" y="564" width="268" height="72" rx="36"/>
  </g>

  <g filter="url(#soft)" fill="#fff">
    <path d="M650 540 Q668 652 780 670 Q668 688 650 800 Q632 688 520 670 Q632 652 650 540 Z"/>
    <path d="M768 278 Q776 320 818 328 Q776 336 768 378 Q760 336 718 328 Q760 320 768 278 Z" opacity="0.92"/>
  </g>
</svg>
